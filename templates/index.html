<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
            display: flex;
            min-height: 100vh;
        }

        /* Сайдбар */
        .sidebar {
            width: 250px;
            background: #1f2937;
            color: white;
            padding: 30px 20px;
        }

        .sidebar h2 {
            margin-bottom: 40px;
        }

        .user-info {
            background: #374151;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .user-info span {
            display: block;
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 5px;
        }

        .user-info strong {
            font-size: 16px;
        }

        .sidebar nav a {
            display: block;
            color: #d1d5db;
            text-decoration: none;
            padding: 12px 10px;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .sidebar nav a:hover,
        .sidebar nav a.active {
            background: #4f46e5;
            color: white;
        }

        /* Основной контент */
        main {
            flex: 1;
            padding: 40px;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            margin-bottom: 8px;
        }

        .card {
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #4f46e5;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            display: none;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            main {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <aside class="sidebar">
        <h2>Панель управления</h2>

        <div class="user-info">
            <span>Вы вошли как</span>
            <strong id="username">{{ name }}</strong>
        </div>
		
        <nav>
            <a href="#" class="active">Личный кабинет</a>
			<a href="/homework">
                Домашние задания
            </a>
            <a href="/">Выйти</a>
        </nav>
    </aside>

    <main>
        <div class="header">
            <h1>Личный кабинет</h1>
            <p>Управление настройками вашей учётной записи</p>
        </div>

        <section class="card" id="password">
            <h2 style="margin-bottom: 25px;">Смена пароля</h2>

            <form action = "http://127.0.0.1:3000/change-password" method = "POST" id="changePasswordForm">

                <div class="form-group">
                    <label for="currentPassword">
                        Текущий пароль
                    </label>
                    <input
                        type="password"
                        id="currentPassword"
                        name="old-password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="newPassword">
                        Новый пароль
                    </label>
                    <input
                        type="password"
                        id="newPassword"
                        name="new-password"
                        minlength="6"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">
                        Повторите новый пароль
                    </label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        required
                    >
                </div>

                <button type="submit">
                    Изменить пароль
                </button>

                <div id="message" class="message"></div>

            </form>
        </section>
    </main>

    <script>
        
    </script>

</body>
</html>
